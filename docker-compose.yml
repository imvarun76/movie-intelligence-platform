services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: movie-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: movie_platform
      POSTGRES_USER: movie_app
      POSTGRES_PASSWORD: movie_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_app -d movie_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
